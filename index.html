<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby tracker</title>
<style>
:root{--bg:#fff;--ink:#000;--mute:#666;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mute:#999;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mute:#999;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Georgia,"Times New Roman",serif}
main{max-width:480px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:26px;margin:0 0 16px}
h2{font-size:18px;margin:0 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
section{margin-bottom:26px}
p{margin:2px 0}
.mute{color:var(--mute)}
.row{display:flex;gap:8px;margin-top:8px}
button,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:0;padding:14px 8px;min-height:52px}
button{flex:1;font-weight:700;cursor:pointer}
button:active{background:var(--ink);color:var(--bg)}
select{flex:1}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.small{flex:none;min-height:0;padding:2px 6px;border:1px solid var(--mute);color:var(--mute);font-weight:400;font-size:14px}
.msg{min-height:1.5em;margin-top:8px;font-weight:700}
.dh{margin-top:16px;font-weight:700;border-bottom:1px solid var(--ink)}
.dh span{font-weight:400;color:var(--mute);font-size:14px;display:block}
.ent{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--mute)}
.ent time{width:74px;flex:none;font-variant-numeric:tabular-nums}
.ent div{flex:1}
.clear{margin-top:24px;flex:none;width:100%;font-weight:400;color:var(--mute);border-color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Baby tracker</h1>

<section>
  <p>Last wet: <b id="sWet">none yet</b></p>
  <p>Last poop: <b id="sPoop">none yet</b></p>
  <p>Last feed: <b id="sFeed">none yet</b></p>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</section>

<section>
  <h2>Diaper</h2>
  <div class="row">
    <button data-d="wet">Wet</button>
    <button data-d="poop">Poop</button>
    <button data-d="both">Both</button>
  </div>
</section>

<section>
  <h2>Breast</h2>
  <p class="mute">Scroll to pick minutes, then tap a side.</p>
  <div class="row"><select id="mins" aria-label="Minutes"></select></div>
  <div class="row">
    <button data-s="Left">Left</button>
    <button data-s="Right">Right</button>
  </div>
</section>

<section>
  <h2>Bottle</h2>
  <p class="mute">Scroll to pick ounces, then save.</p>
  <div class="row"><select id="oz" aria-label="Ounces"></select></div>
  <div class="row"><button id="bottle">Save bottle</button></div>
</section>

<section>
  <h2>History</h2>
  <div id="list"></div>
  <button class="clear" id="clear">Clear all history</button>
</section>
</main>

<script>
const K='baby-log-v1',PK='baby-prefs-v1';
let log=[],prefs={mins:10,oz:3};
try{log=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){}
try{localStorage.removeItem('baby-timer-v1')}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(log))}catch(e){$('msg').textContent='Could not save to this browser.'}};
const savePrefs=()=>{try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');

for(let m=1;m<=60;m++)$('mins').add(new Option(m+(m===1?' minute':' minutes'),m));
for(let o=0.5;o<=12;o+=0.5)$('oz').add(new Option(o+' oz',o));
$('mins').value=prefs.mins;$('oz').value=prefs.oz;
$('mins').onchange=()=>{prefs.mins=+$('mins').value;savePrefs()};
$('oz').onchange=()=>{prefs.oz=+$('oz').value;savePrefs()};

const isWet=e=>e.type==='wet'||e.type==='both', isPoop=e=>e.type==='poop'||e.type==='both', isFeed=e=>e.type==='breast'||e.type==='bottle';
const clock=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dur=s=>s<60?s+' sec':Math.round(s/60)+' min';
function label(e){
  if(e.type==='wet')return 'Wet diaper';
  if(e.type==='poop')return 'Poop diaper';
  if(e.type==='both')return 'Wet and poop diaper';
  if(e.type==='breast')return e.side+' breast, '+dur(e.secs);
  return 'Bottle, '+e.oz+' oz';
}
function ago(fn){
  for(let i=log.length-1;i>=0;i--)if(fn(log[i])){
    const m=Math.max(0,Math.floor((Date.now()-log[i].t)/60000));
    return (m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)+' min')+' ago';
  }
  return 'none yet';
}
function stats(){$('sWet').textContent=ago(isWet);$('sPoop').textContent=ago(isPoop);$('sFeed').textContent=ago(isFeed)}

function add(e){
  e.id=Date.now()+Math.random();e.t=Date.now();
  log.push(e);save();render();
  $('msg').textContent='Logged: '+label(e)+' at '+clock(e.t);
}

function render(){
  stats();
  if(!log.length){$('list').innerHTML='<p class="mute">Nothing logged yet.</p>';return}
  const days={};
  [...log].sort((a,b)=>b.t-a.t).forEach(e=>{(days[dayKey(e.t)]=days[dayKey(e.t)]||[]).push(e)});
  const today=dayKey(Date.now()),yest=dayKey(Date.now()-864e5);
  $('list').innerHTML=Object.keys(days).map(k=>{
    const es=days[k],bt=es.filter(e=>e.type==='bottle');
    const oz=Math.round(bt.reduce((a,e)=>a+e.oz,0)*10)/10;
    const name=k===today?'Today':k===yest?'Yesterday':new Date(k+'T12:00').toLocaleDateString([],{weekday:'long',month:'short',day:'numeric',year:'numeric'});
    const sum=es.filter(isWet).length+' wet, '+es.filter(isPoop).length+' poop, '+es.filter(e=>e.type==='breast').length+' breast, '+bt.length+' bottle'+(bt.length?' ('+oz+' oz)':'');
    return '<div class="dh">'+name+'<span>'+sum+'</span></div>'+
      es.map(e=>'<div class="ent"><time>'+clock(e.t)+'</time><div>'+label(e)+'</div><button class="small" data-del="'+e.id+'">delete</button></div>').join('');
  }).join('');
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.d)add({type:b.dataset.d});
  else if(b.dataset.s)add({type:'breast',side:b.dataset.s,secs:(+$('mins').value)*60});
  else if(b.id==='bottle')add({type:'bottle',oz:+$('oz').value});
  else if(b.dataset.del){if(confirm('Delete this entry?')){log=log.filter(e=>String(e.id)!==b.dataset.del);save();render()}}
  else if(b.id==='clear'){
    if(log.length&&confirm('Delete ALL history? This cannot be undone.')){log=[];save();render();$('msg').textContent='History cleared.'}
  }
});
render();
setInterval(stats,30000);
</script>
</body>
</html>
